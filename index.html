<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Click Me If You Want To Live!!!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px 25px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      max-width: 350px;
      width: 90%;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    img {
      width: 220px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #333;
    }

    .hidden {
      display: none;
    }

    .celebrate {
      animation: pop 0.6s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .confetti {
      position: fixed;
      top: -10px;
      font-size: 24px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="question">Will you be my Valentine? 💕</h1>

    <img
      id="gif"
      src="https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif"
      alt="Puppy eyes"
    />

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <!-- Tiny sound effect -->
  <audio id="popSound">
    <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
  </audio>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const gif = document.getElementById("gif");
    const question = document.getElementById("question");
    const popSound = document.getElementById("popSound");

    let noClickCount = 0;

    const noTexts = [
      "No 😢",
      "Are you sure?",
      "Please say yes 🥺",
      "Seriously… click yes already",
      "I’m begging you 😭",
      "This button is losing confidence",
      "YES is literally right there 👉💖",
      "Okay you’re just being mean now 😩"
    ];

    noBtn.addEventListener("click", () => {
      noClickCount++;

      // Sound
      popSound.currentTime = 0;
      popSound.play();

      // Grow Yes button
      const yesScale = 1 + noClickCount * 0.18;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Shrink No button slightly
      const noScale = Math.max(0.7, 1 - noClickCount * 0.08);
      noBtn.style.transform = `scale(${noScale})`;

      // Change No text
      if (noClickCount < noTexts.length) {
        noBtn.textContent = noTexts[noClickCount];
      } else {
        noBtn.textContent = "There is no escape 😈";
      }
    });

    yesBtn.addEventListener("click", () => {
      question.textContent = "YAY!!! 💖 I’m so happy!";
      gif.src = "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif";
      gif.classList.add("celebrate");
      yesBtn.classList.add("hidden");
      noBtn.classList.add("hidden");
      launchConfetti();
    });

    function launchConfetti() {
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.textContent = "💖";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 4000);
      }
    }
  </script>
</body>
</html>
